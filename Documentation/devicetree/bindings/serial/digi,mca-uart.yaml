%YAML 1.2
---
$id: "http://devicetree.org/schemas/serial/digi,mca-uart.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Digi MCA UART controller

maintainers:
  - name: Digi International
    email: hector.palacios@digi.com

description: |
  UART block provided by the Digi MCA (Micro Controller Assist).
  The MCA exposes one or more UART instances as child nodes.

  These UARTs can be used to wake the system from low power modes, but they
  have more limited capabilities than the main CPU UART controllers.

properties:
  compatible:
    const: digi,mca-uart

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^serial@[0-9a-f]+$":
    type: object
    description: MCA UART instance

    properties:
      reg:
        description: MCA UART base address.
        maxItems: 1

      iopins-names:
        description: |
          Names of the MCA I/O pins assigned to this UART.
          At least "rx" and "tx" must be provided. Optional flow-control
          signals "rts", "cts" may also be provided.
        oneOf:
          - items:
              - const: rx
              - const: tx
          - items:
              - const: rx
              - const: tx
              - const: rts
          - items:
              - const: rx
              - const: tx
              - const: cts
              - const: rts

      iopins:
        description: |
          MCA I/O pin numbers corresponding to iopins-names.

          Not all MCA I/O pins can be used for all UART functions. Refer to
          the hardware documentation for valid pin/function mappings.
        minItems: 2
        maxItems: 4
        items:
          $ref: /schemas/types.yaml#/definitions/uint32

    required:
      - reg
      - iopins-names
      - iopins

    additionalProperties: false

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    mca@63 {
        mca_uart: uart {
            compatible = "digi,mca-uart";
            #address-cells = <1>;
            #size-cells = <0>;

            mca_uart0: serial@900 {
                reg = <0x900>;
                iopins-names = "rx", "tx";
                iopins = <9 10>;
            };

            mca_uart1: serial@920 {
                reg = <0x920>;
                iopins-names = "rx", "tx";
                iopins = <11 16>;
            };

            mca_uart2: serial@940 {
                reg = <0x940>;
                iopins-names = "rx", "tx", "cts", "rts";
                iopins = <2 1 3 4>;
            };
        };
    };
