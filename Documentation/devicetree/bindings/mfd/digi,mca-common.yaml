%YAML 1.2
---
$id: "http://devicetree.org/schemas/mfd/digi,mca-common.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Digi Micro-Controller Assist common properties

maintainers:
  - name: Digi International
    email: hector.palacios@digi.com

description: |
  Common properties for Digi MCA (Micro Controller Assist) and related
  I2C-connected devices.

allOf:
  - $ref: /schemas/i2c/i2c-device.yaml#

properties:
  reg:
    description: I2C slave address
    maxItems: 1

  interrupt-parent:
    $ref: /schemas/types.yaml#/definitions/phandle

  interrupts:
    maxItems: 1

  interrupt-controller:
    type: boolean

  "#interrupt-cells":
    const: 2

  fw-update-gpios:
    maxItems: 1
    description: GPIO used to force firmware update mode

required:
  - reg
  - interrupt-parent
  - interrupts
  - interrupt-controller
  - "#interrupt-cells"

# Only *truly shared* subnodes here
patternProperties:
  "^gpio$":
    $ref: /schemas/gpio/digi,mca-gpio.yaml#

  "^rtc$":
    $ref: /schemas/rtc/digi,mca-rtc.yaml#

additionalProperties: true
