%YAML 1.2
---
$id: "http://devicetree.org/schemas/watchdog/digi,mca-gpio-wdt.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Digi MCA GPIO-refreshed watchdog timer

maintainers:
  - name: Digi International
    email: hector.palacios@digi.com

description: |
  GPIO-refreshed watchdog timers provided by the Digi MCA on ConnectCore
  system-on-modules.

  The MCA exposes a container node with up to four watchdog instances. Each
  instance uses one MCA GPIO to periodically kick the watchdog timer.

properties:
  compatible:
    const: digi,mca-gpio-wdt

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^gpio-wdt@[0-9a-f]+$":
    type: object
    description: Individual MCA GPIO watchdog instance

    properties:
      reg:
        maxItems: 1
        description: Watchdog instance identifier.

      mode:
        enum:
          - toggle
          - level-high
          - level-low
        description: Hardware watchdog kick mode.

      mca-io-number:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: MCA GPIO number used to kick the watchdog timer.

      timeout-sec:
        $ref: /schemas/types.yaml#/definitions/uint32
        minimum: 1
        maximum: 255
        description: Watchdog timeout in seconds.

      irq-no-reset:
        type: boolean
        description: |
          If present, the watchdog generates an interrupt instead of a system
          reset.

      full-reset:
        type: boolean
        description: |
          If present, the watchdog performs a full system reset, including the
          MCA. Otherwise, only the microprocessor is reset. This option is
          valid only when the watchdog is configured to generate a reset and
          not an interrupt.

      no-way-out:
        type: boolean
        description: |
          If present, the watchdog cannot be stopped once started.

      status: true

    required:
      - reg
      - mode
      - mca-io-number
      - timeout-sec

    allOf:
      - if:
          required:
            - irq-no-reset
        then:
          properties:
            full-reset: false

    additionalProperties: false

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    mca@63 {
        gpio-wdt {
            compatible = "digi,mca-gpio-wdt";
            #address-cells = <1>;
            #size-cells = <0>;
            status = "okay";

            gpio-wdt@210 {
                reg = <0x210>;
                full-reset;
                no-way-out;
                mode = "level-high";
                mca-io-number = <10>;
                timeout-sec = <2>;
                status = "okay";
            };

            gpio-wdt@220 {
                reg = <0x220>;
                full-reset;
                no-way-out;
                mode = "toggle";
                mca-io-number = <16>;
                timeout-sec = <1>;
                status = "okay";
            };

            gpio-wdt@230 {
                reg = <0x230>;
                status = "disabled";
            };

            gpio-wdt@240 {
                reg = <0x240>;
                status = "disabled";
            };
        };
    };
