%YAML 1.2
---
$id: "http://devicetree.org/schemas/watchdog/digi,mca-wdt.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Digi MCA watchdog timer

maintainers:
  - name: Digi International
    email: hector.palacios@digi.com

description: |
  Software-refreshed watchdog timer provided by the Digi MCA on ConnectCore
  system-on-modules.

properties:
  compatible:
    const: digi,mca-wdt

  digi,timeout-sec:
    description: Watchdog timeout in seconds.
    $ref: /schemas/types.yaml#/definitions/uint32

  digi,irq-no-reset:
    type: boolean
    description: |
      If present, the watchdog generates an interrupt instead of a system
      reset.

  digi,full-reset:
    type: boolean
    description: |
      If present, the watchdog performs a full system reset, including the
      MCA. Otherwise, only the microprocessor is reset. This option is valid
      only when the watchdog is configured to generate a reset and not an
      interrupt.

required:
  - compatible

allOf:
  - if:
      required:
        - digi,irq-no-reset
    then:
      properties:
        digi,full-reset: false

additionalProperties: false

examples:
  - |
    mca@7e {
        watchdog {
            compatible = "digi,mca-wdt";
            digi,timeout-sec = <15>;
            digi,full-reset;
        };
    };
