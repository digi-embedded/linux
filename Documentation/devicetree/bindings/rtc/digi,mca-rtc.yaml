%YAML 1.2
---
$id: "http://devicetree.org/schemas/rtc/digi,mca-rtc.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Digi MCA Real Time Clock

maintainers:
  - name: Digi International
    email: hector.palacios@digi.com

description: |
  Real-time clock provided by the Digi MCA (Micro Controller Assist)
  on ConnectCore system-on-modules.

properties:
  compatible:
    const: digi,mca-rtc

required:
  - compatible

additionalProperties: false

examples:
  - |
    mca@7e {
        rtc {
            compatible = "digi,mca-rtc";
        };
    };
