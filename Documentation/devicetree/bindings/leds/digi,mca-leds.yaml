%YAML 1.2
---
$id: "http://devicetree.org/schemas/leds/digi,mca-leds.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Digi MCA LEDs controller

maintainers:
  - name: Digi International
    email: hector.palacios@digi.com

description: |
  LED controller provided by the Digi MCA (Micro Controller Assist).
  Each LED is represented as a sub-node and is backed by an MCA IO.

properties:
  compatible:
    const: digi,mca-led

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-9a-f]+$":
    type: object
    description: MCA LED instance

    properties:
      reg:
        maxItems: 1
        description: Index of the MCA LED controller.

      io:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: MCA IO number the LED is connected to.

      label:
        description: Human-readable LED name.

      active-low:
        type: boolean
        description: LED is active low.

      linux,default-trigger:
        description: Default LED trigger.

      led-pattern:
        description: |
          LED blinking pattern (on/off periods in milliseconds).
        $ref: /schemas/types.yaml#/definitions/uint32-array

      retain-state-suspended:
        type: boolean
        description: |
          Retain LED state during suspend. Applies to some triggers like
          default-on or timer.

      retain-state-shutdown:
        type: boolean
        description: Retain LED state during system shutdown.

      panic-indicator:
        type: boolean
        description: LED indicates kernel panic.

    required:
      - reg
      - io

    additionalProperties: false

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    mca@63 {
        led {
            compatible = "digi,mca-led";
            #address-cells = <1>;
            #size-cells = <0>;

            led0: led@0 {
                reg = <0>;
                label = "power:green";
                io = <13>;
                linux,default-trigger = "default-on";
            };

            led1: led@1 {
                reg = <1>;
                label = "USER_LED1:green";
                io = <12>;
                linux,default-trigger = "timer";
                led-pattern = <100 1000>;
                retain-state-suspended;
            };

            led2: led@2 {
                reg = <2>;
                label = "USER_LED2:orange";
                io = <18>;
                linux,default-trigger = "timer";
                led-pattern = <5000 5000>;
                retain-state-suspended;
            };
        };
    };
